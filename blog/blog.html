      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      max-height: 68px;
      box-sizing: border-box;
    }
    .bizce-header-inner {
      max-width: 1250px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }
    .bizce-title-group h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--bizce-dark);
      margin: 0;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .bizce-title-group p {
      font-size: 0.75rem;
      color: var(--bizce-primary);
      margin: 0.15rem 0 0 0;
      font-weight: 600;
    }

    .bizce-center-logo-link {
      display: flex;
      align-items: center;
      height: 48px;
    }
    .bizce-header-logo {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .bizce-nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .nav-link-btn {
      color: #334155;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      background: #f1f5f9;
      transition: background 0.2s;
      cursor: pointer;
      border: none;
    }
    .nav-link-btn:hover {
      background: #e2e8f0;
      color: var(--bizce-primary);
    }

    .layout-wrapper {
      display: flex;
      justify-content: center;
      max-width: 1300px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      gap: 1.5rem;
    }
    .main-content-area {
      flex: 1;
      max-width: 920px;
      width: 100%;
    }

      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;

      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      margin-bottom: 1.25rem;
      gap: 0.75rem;
    }
    .category-pills {

      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .cat-pill {
      background: #f1f5f9;
      color: #475569;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;

    .cat-pill.active {
      background: var(--bizce-primary);
      color: #ffffff;
    }
    .cat-pill-anilts {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .cat-pill-anilts.active {
      background: #d97706;
      color: #ffffff;
      border-color: #d97706;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 1.25rem;
    }
    .post-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.07);
    }
    .card-img-placeholder {
      height: 160px;
      background: linear-gradient(135deg, #0284c7, #1e40af);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 2.8rem;
    }
    .card-img-anilts {
      background: linear-gradient(135deg, #d97706, #78350f) !important;
    }

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;

      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--bizce-muted);
      margin-bottom: 0.6rem;
    }

      color: #0369a1;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
    }
    .post-tag-anilts {

      color: #92400e;
    }

      font-size: 1.15rem;
      font-weight: 700;
      color: var(--bizce-dark);
      margin: 0 0 0.6rem 0;
      line-height: 1.35;

    .post-excerpt {
      font-size: 0.88rem;
      color: #475569;
      line-height: 1.55;
      margin: 0 0 1rem 0;
    }

      justify-content: space-between;
      align-items: center;
      padding-top: 0.85rem;
      border-top: 1px solid #f1f5f9;
    }
    .read-more-btn {
      color: var(--bizce-primary);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .card-tts-badge {
      background: #f0f9ff;
      color: #0284c7;
      border: 1px solid #bae6fd;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      margin-top: 2rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }
    .page-num {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #334155;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;

    .page-num:hover {
      border-color: var(--bizce-primary);
      color: var(--bizce-primary);
    }
    .page-num.active {
      background: var(--bizce-primary);
      color: #ffffff;
      border-color: var(--bizce-primary);
    }

    .reader-view {
      display: none;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 2.25rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.05);
      margin-bottom: 2rem;

    .back-btn {
      background: #f1f5f9;
      border: none;
      padding: 0.45rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: var(--bizce-dark);
      margin-bottom: 1.25rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;

      font-weight: 800;
      color: var(--bizce-dark);
      line-height: 1.25;
      margin: 0 0 0.75rem 0;

      border-radius: 14px;
      padding: 1rem 1.25rem;
      margin: 1.25rem 0 1.75rem 0;

    .tts-header {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--bizce-dark);
      margin-bottom: 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;

    .tts-controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .tts-btn-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tts-btn {
      background: var(--bizce-primary);
      color: #ffffff;
      border: none;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .tts-btn-secondary {
      background: #e2e8f0;
      color: var(--bizce-dark);
    }
    .tts-selects {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.82rem;
    }
    .audio-wave {
      display: none;
      align-items: center;
      gap: 3px;
      height: 14px;
      margin-left: 0.5rem;
    }
    .audio-wave span {
      width: 3px;
      height: 100%;
      background: var(--bizce-primary);
      animation: wave 1.2s infinite ease-in-out;
    }
    .audio-wave span:nth-child(2) { animation-delay: -1.0s; }
    .audio-wave span:nth-child(3) { animation-delay: -0.8s; }

      0%, 40%, 100% { transform: scaleY(0.3); }
      20% { transform: scaleY(1.0); }
    }

      font-size: 1.05rem;
      line-height: 1.8;
      color: #334155;
    }

      background: #f0f9ff;
      border-left: 4px solid var(--bizce-primary);
      margin: 1.25rem 0;
      padding: 0.85rem 1.1rem;
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: #0369a1;
    }
  </style>
</head>

<div class="layout-wrapper">

    </div>

      <h1 class="reader-title" id="readTitle">Yazı Başlığı</h1>
      <div class="post-meta" style="margin-bottom: 1rem;">
        <span id="readDate">Tarih</span>
        <span id="readTime">⏱️ 5 dk okuma</span>
      </div>

      <div class="tts-player-bar">
        <div class="tts-header">

          <div class="audio-wave" id="audioWave">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="tts-controls-row">
          <div class="tts-btn-group">
            <button onclick="playTTS()" class="tts-btn" id="btnPlay">▶️ Dinle</button>
            <button onclick="pauseTTS()" class="tts-btn tts-btn-secondary" id="btnPause">⏸️ Duraklat</button>
            <button onclick="stopTTS()" class="tts-btn tts-btn-secondary" id="btnStop">⏹️ Durdur</button>
          </div>

          <div class="tts-selects">
            <label>🎙️ Ses:</label>
            <select id="voiceGender" onchange="restartTTSIfPlaying()" style="padding: 0.35rem 0.6rem; border-radius: 6px; border: 1px solid #cbd5e1;">
              <option value="male" selected>👨 Erkek (Varsayılan)</option>
              <option value="female">👩 Kadın</option>
            </select>

            <label>⚡ Hız:</label>
            <select id="voiceSpeed" onchange="restartTTSIfPlaying()" style="padding: 0.35rem 0.6rem; border-radius: 6px; border: 1px solid #cbd5e1;">
              <option value="1.0" selected>1.0x (Normal)</option>
              <option value="1.25">1.25x (Hızlı)</option>
              <option value="1.5">1.5x (Çok Hızlı)</option>
            </select>
          </div>
        </div>
      </div>

      <article class="article-body" id="readContent">
      </article>

      <div class="infeed-ad-container" style="margin-top: 2.5rem;">
        <div class="ad-placeholder">Sayfa Altı Reklam Alanı (Bottom Banner)</div>
      </div>
    </div>

  </main>

  <aside class="desktop-ad desktop-ad-right">
    <div class="ad-placeholder">Masaüstü Sağ Reklam<br>(120x300)</div>
  </aside>

</div>

        "content": "<p>Yıllar önce yoğun bir projenin tam ortasındayken, beklenmedik bir aksaklıkla karşılaştık. Herkesin stresli olduğu o anlarda, kurumdaki sessiz bir çalışan hiç yükümlülüğü olmadığı halde yanımıza gelip tek bir soru sordu: 'Nasıl yardımcı olabilirim?'</p><p>O gün bize gösterilen o karşılıksız destek, unvanların ve hiyerarşinin ötesinde insani dayanışmanın ne kadar kıymetli olduğunu öğretti. Gerçek liderlik ve ahlak, kimsenin görmediği anlarda gösterilen karşılıksız nezakette saklıdır.</p>"
      },
      "en": {
        "title": "ANILTILAR 1: An Anonymous Act of Kindness & Unforgettable Lesson",
        "summary": "A sincere memoir story written anonymously, reflecting a life-changing experience on a hectic work day.",
        "content": "<p>Years ago, right in the middle of an intense project, we encountered an unexpected breakdown. At a moment when everyone was stressed, a quiet colleague walked up to us with a single question: 'How can I help?'</p>"
      },
      "ar": {
        "title": "ANILTILAR 1: موقف إنساني ودرس لا يُنسى",
        "summary": "قصة واقيعة مجهولة الأسماء تعكس تجربة إنسانية غيرت وجهة نظرنا في الحياة.",
        "content": "<p>قبل سنوات، وفي منتصف مشروع مكثف، واجهنا عقبة غير متوقعة. في لحظة كان فيها الجميع متوتراً، تقدم زميل هادئ بسؤال واحد: 'كيف يمكنني المساعدة؟'</p>"
      }
    }
  ];

  function setLang(lang) {
    currentLang = lang;
    var btns = document.querySelectorAll('.lang-switcher button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.remove('active');
    }
    
    var activeBtn = document.querySelector('.lang-switcher button[data-lang="' + lang + '"]');
    if (activeBtn) activeBtn.classList.add('active');

    if (lang === 'ar') {
      document.body.setAttribute('dir', 'rtl');
      document.getElementById('subSlogan').innerText = 'نظرة عميقة على التكنولوجيا والحياة والذكريات';
      document.getElementById('lblBack').innerText = 'العودة إلى جميع المقالات';
    } else if (lang === 'en') {
      document.body.removeAttribute('dir');
      document.getElementById('subSlogan').innerText = 'A Deep Perspective on Tech, Life, Humanity, and Memoirs';
      document.getElementById('lblBack').innerText = 'Back to All Articles';
    } else {
      document.body.removeAttribute('dir');
      document.getElementById('subSlogan').innerText = 'Teknolojiye, Hayata, İnsanlığa ve Anılara Derin Bakış';
      document.getElementById('lblBack').innerText = 'Tüm Yazılara Dön';
    }

    if (currentPost) {
      openPost(currentPost.id);
    } else {
      renderPosts();
    }
  }

  function filterPosts(type) {
    currentFilter = type;
    var btns = document.querySelectorAll('.category-pills button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.remove('active');
    }
    if (event && event.target) {
      event.target.classList.add('active');
    }
    renderPosts();
  }

  function renderPosts() {
    var grid = document.getElementById('postsGrid');
    if (!grid) return;
    grid.innerHTML = '';

    var filtered = blogPostsData.filter(function(p) {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'anilts') return p.type === 'anilts';
      return p.type === 'bizce';
    });

    for (var i = 0; i < filtered.length; i++) {
      var post = filtered[i];
      var langData = post[currentLang] || post['tr'];
      var category = post['category_' + currentLang] || post.category;
      var isAnilts = (post.type === 'anilts');

      var card = document.createElement('div');
      card.className = 'post-card';
      card.setAttribute('data-id', post.id);
      card.onclick = (function(pId) {
        return function() { openPost(pId); };
      })(post.id);

      var btnText = (currentLang === 'ar' ? 'اقرأ المزيد ←' : (currentLang === 'en' ? 'Read Story →' : 'Devamını Oku →'));
      var ttsText = (currentLang === 'ar' ? 'استماع' : (currentLang === 'en' ? 'Listen' : 'Sesli Dinle'));

      var imgClass = 'card-img-placeholder' + (isAnilts ? ' card-img-anilts' : '');
      var tagClass = 'post-tag' + (isAnilts ? ' post-tag-anilts' : '');

      card.innerHTML = '<div class="' + imgClass + '">' + (post.icon || '📝') + '</div>' +
        '<div class="card-body">' +
          '<div>' +
            '<div class="post-meta">' +
              '<span class="' + tagClass + '">' + category + '</span>' +
              '<span>' + post.readTime + '</span>' +
            '</div>' +
            '<h2 class="post-title">' + langData.title + '</h2>' +
            '<p class="post-excerpt">' + langData.summary + '</p>' +
          '</div>' +
          '<div class="card-actions">' +
            '<span class="read-more-btn">' + btnText + '</span>' +
            '<span class="card-tts-badge">🔊 ' + ttsText + '</span>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    }
  }

  function openPost(id) {
    stopTTS();
    currentPost = blogPostsData.find(function(p) { return p.id === id; });
    if (!currentPost) return;

    var langData = currentPost[currentLang] || currentPost['tr'];
    var category = currentPost['category_' + currentLang] || currentPost.category;

    document.getElementById('readCategory').innerText = category;
    document.getElementById('readTitle').innerText = langData.title;
    document.getElementById('readDate').innerText = currentPost.date;
    document.getElementById('readTime').innerText = '⏱️ ' + currentPost.readTime;
    document.getElementById('readContent').innerHTML = langData.content;

    document.getElementById('listView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showList() {
    stopTTS();
    currentPost = null;
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    renderPosts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function playTTS() {
    if (!synth) return alert("Tarayıcınız sesli okuma özelliğini desteklemiyor.");
    if (synth.speaking && synth.paused) {
      synth.resume();
      document.getElementById('audioWave').style.display = 'inline-flex';
      return;
    }

    synth.cancel();

    var articleText = document.getElementById('readContent').innerText;
    currentUtterance = new SpeechSynthesisUtterance(articleText);

    if (currentLang === 'tr') currentUtterance.lang = 'tr-TR';
    else if (currentLang === 'en') currentUtterance.lang = 'en-US';
    else if (currentLang === 'ar') currentUtterance.lang = 'ar-SA';

    var speed = parseFloat(document.getElementById('voiceSpeed').value || '1.0');
    currentUtterance.rate = speed;

    var voices = synth.getVoices();
    var genderPref = document.getElementById('voiceGender').value;
    
    var matchedVoice = voices.find(function(v) {
      return v.lang.startsWith(currentUtterance.lang.slice(0, 2)) && 
      (genderPref === 'female' ? (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Yelda')) : (v.name.includes('Male') || v.name.includes('David') || v.name.includes('Tolga')));
    });
    
    if (!matchedVoice) {
      matchedVoice = voices.find(function(v) { return v.lang.startsWith(currentUtterance.lang.slice(0, 2)); });
    }
    if (matchedVoice) currentUtterance.voice = matchedVoice;

    currentUtterance.onstart = function() {
      document.getElementById('audioWave').style.display = 'inline-flex';
    };
    currentUtterance.onend = function() {
      document.getElementById('audioWave').style.display = 'none';
    };

    synth.speak(currentUtterance);
  }

  function pauseTTS() {
    if (synth && synth.speaking) {
      synth.pause();
      document.getElementById('audioWave').style.display = 'none';
    }
  }

  function stopTTS() {
    if (synth) {
      synth.cancel();
      document.getElementById('audioWave').style.display = 'none';
    }
  }

  function restartTTSIfPlaying() {
    if (synth && synth.speaking) {
      playTTS();
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('cat') === 'anilts') {
      currentFilter = 'anilts';
    }
    renderPosts();
  });
</script>
