<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">MSK Labs - Uygulama Detayı</title>
  <meta id="pageDesc" name="description" content="MSK Labs mobil ve masaüstü yazılım uygulaması detay ve indirme sayfası.">

  <!-- OpenGraph Dynamic Meta Tags for Social Media (WhatsApp, X, Facebook) -->
  <meta id="ogTitle" property="og:title" content="MSK Labs Uygulaması">
  <meta id="ogDesc" property="og:description" content="MSK Labs reklamsız ve ücretsiz yazılımları.">
  <meta id="ogImage" property="og:image" content="img/MSKLabsLogo.svg">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="assets/css/global.css?v=25">
  <style>
    .app-hero-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    .app-header-flex {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .app-big-icon {
      font-size: 3.5rem;
      width: 90px;
      height: 90px;
      border-radius: 20px;
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 12px rgba(0,0,0,0.06);
    }
    .app-meta-pills {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .meta-pill {
      background: #f1f5f9;
      color: #334155;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }
    .feature-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
    }
    .feature-list li {
      padding: 0.5rem 0;
      border-bottom: 1px dashed #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #334155;
      font-weight: 500;
    }
    .action-btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .primary-dl-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s;
    }
    .primary-dl-btn:hover {
      transform: translateY(-2px);
    }
    .secondary-btn {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Layout Injector Header -->
  <header id="site-header" class="site-header"></header>

  <main style="max-width: 900px; margin: 0 auto; padding: 0 1rem;">
    <div id="appContainer" class="app-hero-card">
      <!-- Dynamic Content Rendered Here -->
      <p style="text-align: center; color: #64748b;">Uygulama bilgileri yükleniyor...</p>
    </div>
  </main>

  <!-- Layout Injector Footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="assets/js/apps-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var appId = urlParams.get('id') || urlParams.get('app') || 'haydinamaza';
      var app = window.MSK_APPS_DATA[appId] || window.MSK_APPS_DATA['haydinamaza'];

      // Get language
      var activeLang = localStorage.getItem('user_lang') || 'tr';
      function t(obj) { return obj[activeLang] || obj['tr'] || ''; }

      // Update Page Meta & Social OpenGraph
      var titleText = app.name[activeLang] + " - MSK Labs";
      document.title = titleText;
      document.getElementById('pageTitle').innerText = titleText;
      document.getElementById('pageDesc').setAttribute('content', app.description[activeLang]);
      document.getElementById('ogTitle').setAttribute('content', titleText);
      document.getElementById('ogDesc').setAttribute('content', app.description[activeLang]);

      // Render App HTML Card
      var container = document.getElementById('appContainer');
      var featuresHTML = app.features.map(function(f) {
        return '<li>✅ ' + t(f) + '</li>';
      }).join('');

      container.innerHTML = `
        <div class="app-header-flex">
          <div class="app-big-icon">${app.icon}</div>
          <div>
            <h1 style="margin: 0; font-size: 1.8rem; color: #0f172a;">${t(app.name)}</h1>
            <p style="margin: 0.25rem 0 0 0; color: #475569; font-weight: 600; font-size: 1rem;">${t(app.tagline)}</p>
            <div class="app-meta-pills">
              <span class="meta-pill">v${app.version}</span>
              <span class="meta-pill">${app.platform}</span>
              <span class="meta-pill">${app.rating}</span>
            </div>
          </div>
        </div>

        <p style="font-size: 1.05rem; line-height: 1.7; color: #334155;">${t(app.description)}</p>

        <h3 style="margin-top: 1.5rem; color: #0f172a;">Öne Çıkan Özellikler / Highlights</h3>
        <ul class="feature-list">
          ${featuresHTML}
        </ul>

        <div class="action-btn-group">
          <a href="${app.storeUrl}" class="primary-dl-btn">📲 Uygulamayı İndir / Get App</a>
          <a href="${app.supportPage}" class="secondary-btn">💬 Destek &amp; SSS</a>
          <a href="changelog.html?app=${app.id}" class="secondary-btn">📜 Sürüm Günlüğü</a>
        </div>
      `;
    })();
  </script>
</body>
</html>
